%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/nintendo,hollywood-nand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ATI/Nintendo Hollywood and Latte NAND controller

maintainers:
  - Michael "Techflash" Garofalo <officialTechflashYT@gmail.com>

description: |
  Each bank exposes 512 MiB with 2048-byte pages, 64-byte spare areas and
  128 KiB eraseblocks. Hollywood has bank 0. Latte has bank 1 (SLCCMPT) and
  bank 2 (SLC).

allOf:
  - $ref: nand-controller.yaml#

properties:
  compatible:
    enum:
      - nintendo,hollywood-nand
      - nintendo,latte-nand
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  memory-region:
    maxItems: 1

patternProperties:
  "^nand@[0-2]$":
    type: object
    $ref: raw-nand-chip.yaml#
    properties:
      reg:
        maxItems: 1
      nvmem-cells:
        maxItems: 1
      nvmem-cell-names:
        items:
          - const: nand-key
    required:
      - reg
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - memory-region

unevaluatedProperties: false

examples:
  - |
    nand-controller@d010000 {
        compatible = "nintendo,hollywood-nand";
        reg = <0x0d010000 0x100>;
        interrupt-parent = <&pic>;
        interrupts = <1>;
        memory-region = <&nand_crypto_dma>;
        #address-cells = <1>;
        #size-cells = <0>;

        nand@0 {
            reg = <0>;
            nvmem-cells = <&nand_key>;
            nvmem-cell-names = "nand-key";
        };
    };
  - |
    nand-controller@d010000 {
        compatible = "nintendo,latte-nand";
        reg = <0x0d010000 0x100>;
        interrupt-parent = <&pic>;
        interrupts = <1>;
        memory-region = <&nand_crypto_dma>;
        #address-cells = <1>;
        #size-cells = <0>;

        nand@1 {
            reg = <1>;
            nvmem-cells = <&vwii_nand_key>;
            nvmem-cell-names = "nand-key";
        };
        nand@2 {
            reg = <2>;
            nvmem-cells = <&slc_key>;
            nvmem-cell-names = "nand-key";
        };
    };
